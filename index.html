<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CPS Online - Premium Messenger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cps: { 400:'#36a7f8', 500:'#0c8ce9', 600:'#006fc7', 700:'#0159a1' },
            dark: { 900:'#0a0e17', 800:'#111827', 700:'#1a2332', 600:'#243044' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase App, Auth & Firestore SDKs (CDN) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD7NG4munqDgSrNS3X-EHc679cgpdgrmAM",
      authDomain: "messanger-b2504.firebaseapp.com",
      projectId: "messanger-b2504",
      storageBucket: "messanger-b2504.firebasestorage.app",
      messagingSenderId: "314659092331",
      appId: "1:314659092331:web:e310c93e51e0fffc9d7e2e"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0e17; color: #e2e8f0; margin: 0; overflow: hidden; height: 100dvh; }
    .glass { background: rgba(17,24,39,0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.06); }
    .input-f { background: rgba(15,23,42,0.9); border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s ease; }
    .input-f:focus { outline: none; border-color: #0c8ce9; box-shadow: 0 0 0 3px rgba(12,140,233,0.2); }
    .btn-p { background: linear-gradient(135deg,#0c8ce9,#006fc7); transition: transform 0.1s ease; }
    .btn-p:active { transform: scale(0.97); }
    .bubble-me { background: linear-gradient(135deg,#0c8ce9,#0159a1); border-radius: 18px 18px 4px 18px; }
    .bubble-other { background: #1a2332; border-radius: 18px 18px 18px 4px; }
    .nav-item.active { color: #0c8ce9; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .safe-b { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .online-dot { width: 10px; height: 10px; background: #22c55e; border: 2px solid #0a0e17; border-radius: 50%; }
    
    .owner-badge { background: linear-gradient(135deg, #ffd700, #ff8c00, #ff4500); color: #0a0e17; padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; box-shadow: 0 0 10px rgba(255,215,0,0.5); animation: shimmer 3s infinite linear; }
    .verified-badge { background: linear-gradient(135deg, #ef4444, #111827, #94a3b8); color: white; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body class="h-[100dvh] flex flex-col" data-package="com.cpsonline.app">

<!-- ========== AUTH ========== -->
<div id="auth" class="fixed inset-0 z-50 flex flex-col bg-dark-900 fade-in">
  <div class="flex-1 flex flex-col justify-center px-6 pb-8 max-w-md mx-auto w-full">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl overflow-hidden shadow-lg shadow-cps-500/30 mb-3 cursor-pointer select-none border border-white/10 bg-dark-800">
        <img src="https://i.ibb.co.com/hxpn47Zf/IMG-20261114-090911-816.jpg" alt="CPS Online Logo" class="w-full h-full object-cover" />
      </div>
      <h1 class="text-2xl font-bold text-white">CPS Online</h1>
      <p class="text-slate-400 text-xs mt-1">com.cpsonline.app</p>
    </div>

    <div class="glass rounded-3xl p-6 shadow-2xl">
      <div class="flex gap-1 p-1 bg-dark-700 rounded-xl mb-5">
        <button id="tabLogin" onclick="switchAuth('login')" class="flex-1 py-2.5 rounded-lg text-sm font-medium bg-cps-600 text-white transition-all">Login</button>
        <button id="tabReg" onclick="switchAuth('reg')" class="flex-1 py-2.5 rounded-lg text-sm font-medium text-slate-400 transition-all">Register</button>
      </div>

      <div id="loginBox" class="space-y-3 fade-in">
        <input id="loginId" type="text" placeholder="Email" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500">
        <input id="loginPass" type="password" placeholder="Password" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500">
        <button onclick="doLogin()" class="btn-p w-full py-3.5 rounded-xl text-sm font-semibold text-white mt-1">Sign In</button>
      </div>

      <div id="regBox" class="hidden space-y-4 fade-in">
        <div class="flex items-center justify-center gap-2 mb-2">
          <div id="s1" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold bg-cps-600 text-white">1</div>
          <div class="w-6 h-0.5 bg-dark-600"></div>
          <div id="s2" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold bg-dark-600 text-slate-400">2</div>
          <div class="w-6 h-0.5 bg-dark-600"></div>
          <div id="s3" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold bg-dark-600 text-slate-400">3</div>
          <div class="w-6 h-0.5 bg-dark-600"></div>
          <div id="s4" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold bg-dark-600 text-slate-400">4</div>
        </div>

        <div id="r1">
          <input id="regName" type="text" placeholder="Full Name" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500 mb-3">
          <button onclick="regNext(2)" class="btn-p w-full py-3.5 rounded-xl text-sm font-semibold text-white">Next</button>
        </div>
        <div id="r2" class="hidden">
          <input id="regEmail" type="email" placeholder="Email Address" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500 mb-3">
          <div class="flex gap-2">
            <button onclick="regNext(1)" class="flex-1 py-3.5 rounded-xl text-sm font-medium bg-dark-600 text-slate-300">Back</button>
            <button onclick="regNext(3)" class="flex-1 btn-p py-3.5 rounded-xl text-sm font-semibold text-white">Next</button>
          </div>
        </div>
        <div id="r3" class="hidden">
          <input id="regPass" type="password" placeholder="Password (min 6 chars)" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500 mb-3">
          <input id="regPass2" type="password" placeholder="Confirm Password" class="input-f w-full px-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500 mb-3">
          <div class="flex gap-2">
            <button onclick="regNext(2)" class="flex-1 py-3.5 rounded-xl text-sm font-medium bg-dark-600 text-slate-300">Back</button>
            <button onclick="regNext(4)" class="flex-1 btn-p py-3.5 rounded-xl text-sm font-semibold text-white">Next</button>
          </div>
        </div>
        <div id="r4" class="hidden">
          <div class="relative mb-3">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">@</span>
            <input id="regUser" type="text" placeholder="Username (letters/numbers)" class="input-f w-full pl-8 pr-4 py-3.5 rounded-xl text-sm text-white placeholder-slate-500">
          </div>
          <div class="flex gap-2">
            <button onclick="regNext(3)" class="flex-1 py-3.5 rounded-xl text-sm font-medium bg-dark-600 text-slate-300">Back</button>
            <button onclick="doRegister()" class="flex-1 btn-p py-3.5 rounded-xl text-sm font-semibold text-white">Create Account</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ========== MAIN APP ========== -->
<div id="app" class="hidden h-[100dvh] flex flex-col bg-dark-900 fade-in">
  <div class="flex-1 relative overflow-hidden">

    <!-- CHATS -->
    <div id="pageChats" class="absolute inset-0 flex flex-col fade-in">
      <div class="px-4 pt-4 pb-2 flex items-center justify-between">
        <h1 class="text-xl font-bold text-white">Chats</h1>
        <button onclick="openNewChat()" class="w-9 h-9 rounded-full bg-cps-600/20 flex items-center justify-center text-cps-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>
      <div class="px-4 pb-2">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="chatSearch" type="text" placeholder="Search chats..." oninput="filterPersonal(this.value)" class="input-f w-full pl-9 pr-3 py-2.5 rounded-xl text-sm text-white placeholder-slate-500">
        </div>
      </div>
      <div id="personalList" class="flex-1 overflow-y-auto scrollbar-none px-2"></div>
    </div>

    <!-- GROUPS -->
    <div id="pageGroups" class="absolute inset-0 flex flex-col hidden fade-in">
      <div class="px-4 pt-4 pb-2 flex items-center justify-between">
        <h1 class="text-xl font-bold text-white">Groups</h1>
        <button onclick="openCreateGroup()" class="w-9 h-9 rounded-full bg-cps-600/20 flex items-center justify-center text-cps-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>
      <div class="px-4 pb-2">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="groupSearch" type="text" placeholder="Search groups..." oninput="filterGroups(this.value)" class="input-f w-full pl-9 pr-3 py-2.5 rounded-xl text-sm text-white placeholder-slate-500">
        </div>
      </div>
      <div id="groupList" class="flex-1 overflow-y-auto scrollbar-none px-2"></div>
    </div>

    <!-- SEARCH -->
    <div id="pageSearch" class="absolute inset-0 flex flex-col hidden fade-in">
      <div class="px-4 pt-4 pb-2">
        <h1 class="text-xl font-bold text-white mb-3">Search</h1>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="globalSearch" type="text" placeholder="Search by name or @username..." oninput="doGlobalSearch(this.value)" class="input-f w-full pl-9 pr-3 py-3 rounded-xl text-sm text-white placeholder-slate-500">
        </div>
      </div>
      <div id="searchResults" class="flex-1 overflow-y-auto scrollbar-none px-2 pt-2"></div>
    </div>

    <!-- PROFILE -->
    <div id="pageProfile" class="absolute inset-0 flex flex-col hidden overflow-y-auto scrollbar-none fade-in">
      <div class="px-4 pt-4 pb-2 flex justify-between items-center">
        <h1 class="text-xl font-bold text-white">Profile Settings</h1>
        <span id="ownerTagNav" class="owner-badge hidden">OWNER</span>
      </div>
      <div class="flex flex-col items-center px-6 pt-4">
        <div class="relative mb-3 cursor-pointer" onclick="document.getElementById('avInput').click()">
          <div class="p-0.5 rounded-full bg-gradient-to-br from-cps-400 to-cps-700">
            <img id="profAv" src="" class="w-24 h-24 rounded-full bg-dark-700 object-cover">
          </div>
          <div class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-cps-600 flex items-center justify-center border-2 border-dark-900 shadow">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </div>
        </div>
        <input type="file" id="avInput" accept="image/*" class="hidden" onchange="changeMyAvatar(event)">
        <p class="text-lg font-semibold text-white flex items-center gap-1.5" id="profNameDisplay"></p>
        <p class="text-sm text-cps-400" id="profUserDisplay"></p>
        
        <!-- Dynamic Link Card -->
        <div class="w-full mt-3 p-3 rounded-xl bg-dark-800 border border-white/5 flex items-center justify-between gap-2">
          <div class="min-w-0 flex-1">
            <p class="text-[10px] text-slate-400">Profile Link</p>
            <p id="profLinkText" class="text-xs text-slate-200 truncate"></p>
          </div>
          <button onclick="copyProfileLink()" class="px-3 py-1.5 rounded-lg bg-cps-600/20 text-cps-400 text-xs font-medium shrink-0">Copy</button>
        </div>

        <!-- Verification Request Button (Service OFF) -->
        <button onclick="requestVerification()" class="w-full mt-2 py-2.5 rounded-xl bg-dark-700 text-slate-300 text-xs font-medium border border-white/5">
          ✨ Request Verified Badge (Currently Unavailable)
        </button>

        <button id="btnOwnerPanel" onclick="openOwnerPanel()" class="w-full mt-3 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-red-600 text-white font-semibold text-sm shadow-lg hidden">
          👑 Owner Control Panel (Admin)
        </button>
      </div>

      <div class="px-6 mt-4 space-y-3 pb-8 max-w-md mx-auto w-full">
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Display Name</label>
          <input id="editName" type="text" class="input-f w-full px-4 py-3 rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Username</label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">@</span>
            <input id="editUser" type="text" class="input-f w-full pl-8 pr-4 py-3 rounded-xl text-sm text-white">
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 mb-1 block">Bio</label>
          <textarea id="editBio" rows="2" class="input-f w-full px-4 py-3 rounded-xl text-sm text-white resize-none" placeholder="Write something about yourself..."></textarea>
        </div>

        <div class="pt-2 border-t border-white/5 space-y-3">
          <p class="text-xs font-semibold text-cps-400">Change Password (Optional)</p>
          <input id="oldPass" type="password" placeholder="Current Password" class="input-f w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-500">
          <input id="newPass" type="password" placeholder="New Password (min 6 chars)" class="input-f w-full px-4 py-3 rounded-xl text-sm text-white placeholder-slate-500">
        </div>

        <button onclick="saveProfile()" class="btn-p w-full py-3.5 rounded-xl text-sm font-semibold text-white mt-2">Save Changes</button>
        <button onclick="logout()" class="w-full py-3.5 rounded-xl text-sm font-medium bg-red-500/10 text-red-400">Logout</button>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="glass border-t border-white/5 safe-b shrink-0 z-20">
    <div class="flex items-center justify-around h-14">
      <button onclick="goPage('chats')" id="navChats" class="nav-item active flex flex-col items-center gap-0.5 text-xs w-16">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
        <span>Chats</span>
      </button>
      <button onclick="goPage('groups')" id="navGroups" class="nav-item flex flex-col items-center gap-0.5 text-xs text-slate-400 w-16">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Groups</span>
      </button>
      <button onclick="goPage('search')" id="navSearch" class="nav-item flex flex-col items-center gap-0.5 text-xs text-slate-400 w-16">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span>Search</span>
      </button>
      <button onclick="goPage('profile')" id="navProfile" class="nav-item flex flex-col items-center gap-0.5 text-xs text-slate-400 w-16">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>Profile</span>
      </button>
    </div>
  </nav>
</div>

<!-- VIEW USER PROFILE MODAL -->
<div id="userProfileModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden p-4 fade-in">
  <div class="glass rounded-3xl w-full max-w-xs p-6 text-center slide-up relative">
    <button onclick="closeUserProfileModal()" class="absolute top-4 right-4 text-slate-400 font-bold text-sm">✕</button>
    <div class="flex justify-center mb-3">
      <img id="upmAv" src="" class="w-20 h-20 rounded-full bg-dark-700 object-cover border-2 border-cps-500">
    </div>
    <div class="flex items-center justify-center gap-1 mb-1">
      <h3 id="upmName" class="text-base font-bold text-white"></h3>
      <span id="upmBadge"></span>
    </div>
    <p id="upmUser" class="text-xs text-cps-400 mb-3"></p>
    <p id="upmBio" class="text-xs text-slate-300 bg-dark-800 p-3 rounded-xl mb-4 min-h-[40px]"></p>
    <button id="upmMessageBtn" onclick="" class="btn-p w-full py-2.5 rounded-xl text-xs font-semibold text-white">Send Message</button>
  </div>
</div>

<!-- SECRET OWNER MODAL -->
<div id="ownerModal" class="fixed inset-0 z-50 bg-dark-900/95 flex flex-col hidden p-6 overflow-y-auto slide-up">
  <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4 max-w-md mx-auto w-full">
    <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">👑 Owner Control Panel</h2>
    <button onclick="closeOwnerPanel()" class="text-slate-400 font-bold text-lg">✕</button>
  </div>
  <div class="space-y-4 max-w-md mx-auto w-full">
    <div class="p-4 rounded-xl bg-dark-800 border border-amber-500/30">
      <p class="text-xs text-slate-400">System Info</p>
      <p class="text-sm font-semibold text-white mt-1">Total Users: <span id="statUserCount" class="text-cps-400">0</span></p>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-white mb-2">User Management (Ban / Verify)</h3>
      <div id="ownerUserList" class="space-y-2 max-h-60 overflow-y-auto scrollbar-none"></div>
    </div>

    <div class="pt-4 border-t border-white/10">
      <button onclick="resetAllMessages()" class="w-full py-3 rounded-xl bg-red-600/20 text-red-400 text-sm font-semibold border border-red-500/30">
        ⚠️ Reset All Messages
      </button>
    </div>
  </div>
</div>

<!-- CHAT VIEW -->
<div id="chatView" class="fixed inset-0 z-40 bg-dark-900 flex flex-col hidden slide-up">
  <div class="h-14 glass border-b border-white/5 flex items-center px-3 gap-3 shrink-0">
    <button onclick="closeChat()" class="w-9 h-9 rounded-full flex items-center justify-center text-slate-300">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="relative cursor-pointer" onclick="viewChatProfile()">
      <img id="cAvatar" src="" class="w-9 h-9 rounded-full bg-dark-700 object-cover">
      <span id="cOnline" class="online-dot absolute bottom-0 right-0 hidden"></span>
    </div>
    <div class="flex-1 min-w-0 cursor-pointer" onclick="viewChatProfile()">
      <p id="cName" class="text-sm font-semibold text-white truncate flex items-center gap-1"></p>
      <p id="cStatus" class="text-[11px] text-slate-400 truncate"></p>
    </div>

<script>
const DB = {
  cache: {},
  get(key, def) { const v = this.cache[key]; return v === undefined ? def : JSON.parse(JSON.stringify(v)); },
  set(key, val) {
    this.cache[key] = JSON.parse(JSON.stringify(val));
    if (key === 'session') { localStorage.setItem('cps_session', JSON.stringify(val)); return; }
    db.collection('kv').doc(key).set({ v: JSON.stringify(val) }).catch(e => console.warn('save failed', e));
  }
};
window.kvReady = new Promise(resolve => {
  db.collection('kv').onSnapshot(snap => {
    snap.docChanges().forEach(ch => { DB.cache[ch.doc.id] = ch.type === 'removed' ? undefined : JSON.parse(ch.doc.data().v || 'null'); });
    resolve();
    window.dispatchEvent(new Event('cps-sync'));
  }, e => { console.warn(e); resolve(); });
});

let me = null, activeId = null, activeType = null, tempGAvatar = null;
let clickCount = 0, clickTimer = null;




function switchAuth(tab) {
  document.getElementById('loginBox').classList.toggle('hidden', tab !== 'login');
  document.getElementById('regBox').classList.toggle('hidden', tab !== 'reg');
  document.getElementById('tabLogin').className = 'flex-1 py-2.5 rounded-lg text-sm font-medium ' + (tab==='login' ? 'bg-cps-600 text-white' : 'text-slate-400');
  document.getElementById('tabReg').className = 'flex-1 py-2.5 rounded-lg text-sm font-medium ' + (tab==='reg' ? 'bg-cps-600 text-white' : 'text-slate-400');
  if (tab === 'reg') regNext(1);
}

function regNext(step) {
  if (step === 2 && !document.getElementById('regName').value.trim()) return toast('Please enter your full name');
  if (step === 3) { const e = document.getElementById('regEmail').value.trim(); if (!e || !e.includes('@')) return toast('Please enter a valid email'); }
  if (step === 4) {
    const p = document.getElementById('regPass').value, p2 = document.getElementById('regPass2').value;
    if (p.length < 6) return toast('Password must be at least 6 characters');
    if (p !== p2) return toast('Passwords do not match');
  }
  for (let i = 1; i <= 4; i++) {
    document.getElementById('r' + i).classList.toggle('hidden', i !== step);
    const s = document.getElementById('s' + i);
    s.className = 'w-7 h-7 rounded-full flex items-center justify-center text-xs font-semibold ' + (i < step ? 'bg-cps-700 text-white' : i === step ? 'bg-cps-600 text-white' : 'bg-dark-600 text-slate-400');
  }
}

let pendingReg = null, justRegistered = false;
function authMsg(e) {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found/.test(c)) return 'Email or password is wrong';
  if (c.includes('email-already-in-use')) return 'This email already has an account';
  if (c.includes('weak-password')) return 'Password must be at least 6 characters';
  if (c.includes('invalid-email')) return 'Enter a valid email';
  if (c.includes('too-many-requests')) return 'Too many tries. Wait a moment.';
  return (e && e.message) || 'Something went wrong';
}
async function doRegister() {
  const username = document.getElementById('regUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!username || username.length < 3) return toast('Username must be at least 3 characters');
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  const pass = document.getElementById('regPass').value;
  await kvReady;
  if (DB.get('users', []).find(u => u.username === username)) return toast('Username is already taken');
  pendingReg = { id: '', name: document.getElementById('regName').value.trim(), email, username,
    avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${username}`, bio: '', online: true, isBanned: false, isVerified: false };
  justRegistered = true;
  try { await auth.createUserWithEmailAndPassword(email, pass); }
  catch (e) { pendingReg = null; justRegistered = false; toast(authMsg(e)); }
}
async function doLogin() {
  const email = document.getElementById('loginId').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) return toast('Please fill in all fields');
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch (e) { toast(authMsg(e)); }
}
function ensureWorldGroup() {
  let groups = DB.get('groups', []);
  let world = groups.find(g => g.id === 'world');
  if (!world) {
    world = { id: 'world', name: 'CPS WORLD Group', avatar: 'https://api.dicebear.com/7.x/identicon/svg?seed=CPSWORLD', members: [], admins: ['system'], createdBy: 'system', isWorld: true };
    groups.unshift(world);
  }
  if (!world.members.includes(me.id)) world.members.push(me.id);
  DB.set('groups', groups);
  let msgs = DB.get('messages', {});
  if (!msgs['world']) msgs['world'] = [];
  DB.set('messages', msgs);
}

function enterApp(firstTime) {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadProfileUI(); renderPersonal(); renderGroups(); goPage('chats');
  if (firstTime) setTimeout(() => goPage('profile'), 300);
}

function showAuth() {
  if (CALL) hangup();
  stopRingListener();
  me = null;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
  switchAuth('login');
}
function logout() { auth.signOut(); }

function goPage(page) {
  ['chats','groups','search','profile'].forEach(p => {
    document.getElementById('page' + p.charAt(0).toUpperCase() + p.slice(1)).classList.toggle('hidden', p !== page);
    const nav = document.getElementById('nav' + p.charAt(0).toUpperCase() + p.slice(1));
    nav.classList.toggle('active', p === page);
    nav.classList.toggle('text-slate-400', p !== page);
  });
  if (page === 'chats') renderPersonal();
  if (page === 'groups') renderGroups();
  if (page === 'search') {
    document.getElementById('globalSearch').value = '';
    document.getElementById('searchResults').innerHTML = '<p class="text-center text-slate-500 text-sm py-8">Search by name or username</p>';
  }
  if (page === 'profile') loadProfileUI();
}

function getPersonalChats() { return DB.get('personalChats_' + me.id, []); }
function savePersonalChats(list) { DB.set('personalChats_' + me.id, list); }

function renderPersonal(filter = '') {
  const list = document.getElementById('personalList');
  const chats = getPersonalChats();
  const users = DB.get('users', []);
  let items = chats.map(c => { const u = users.find(x => x.id === c.userId); return u ? { ...c, user: u } : null; }).filter(Boolean);
  if (filter) { const f = filter.toLowerCase(); items = items.filter(i => i.user.name.toLowerCase().includes(f) || i.user.username.includes(f)); }
  if (items.length === 0) {
    list.innerHTML = `<div class="flex flex-col items-center justify-center h-48 text-slate-500"><p class="text-sm">No chats yet</p></div>`;
    return;
  }
  list.innerHTML = items.map(i => `
    <div class="flex items-center gap-3 px-3 py-3 rounded-2xl active:bg-white/5 cursor-pointer" onclick="openChat('${i.userId}','personal')">
      <div class="relative shrink-0" onclick="event.stopPropagation(); viewUserProfile('${i.user.id}')"><img src="${i.user.avatar}" class="w-12 h-12 rounded-full bg-dark-700 object-cover">${i.user.online ? '<span class="online-dot absolute bottom-0 right-0"></span>' : ''}</div>
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-center"><span class="font-medium text-sm text-white truncate flex items-center gap-1">${esc(i.user.name)} ${getBadgeHtml(i.user)}</span><span class="text-[10px] text-slate-500">${i.time || ''}</span></div>
        <div class="flex justify-between items-center mt-0.5"><span class="text-xs text-slate-400 truncate">${esc(i.lastMsg || '')}</span></div>
      </div>
    </div>`).join('');
}

function filterPersonal(v) { renderPersonal(v); }

function renderGroups(filter = '') {
  const list = document.getElementById('groupList');
  let groups = DB.get('groups', []).filter(g => g.members.includes(me.id));
  if (filter) { const f = filter.toLowerCase(); groups = groups.filter(g => g.name.toLowerCase().includes(f)); }
  if (groups.length === 0) { list.innerHTML = `<div class="flex flex-col items-center justify-center h-48 text-slate-500"><p class="text-sm">No groups found</p></div>`; return; }
  const msgs = DB.get('messages', {});
  list.innerHTML = groups.map(g => {
    const m = (msgs[g.id] || []).slice(-1)[0];
    return `<div onclick="openChat('${g.id}','group')" class="flex items-center gap-3 px-3 py-3 rounded-2xl active:bg-white/5 cursor-pointer">
      <img src="${g.avatar}" class="w-12 h-12 rounded-full bg-dark-700 object-cover shrink-0">
      <div class="flex-1 min-w-0"><div class="flex justify-between items-center"><span class="font-medium text-sm text-white truncate">${esc(g.name)}</span><span class="text-[10px] text-slate-500">${m ? m.time : ''}</span></div>
      <p class="text-xs text-slate-400 truncate mt-0.5">${esc(m ? m.text : 'New group')}</p></div></div>`;
  }).join('');
}

function filterGroups(v) { renderGroups(v); }

function openCreateGroup() {
  tempGAvatar = null;
  document.getElementById('newGName').value = '';
  document.getElementById('newGAv').src = 'https://api.dicebear.com/7.x/identicon/svg?seed=' + Date.now();
  document.getElementById('createGroupModal').classList.remove('hidden');
  document.getElementById('createGroupModal').classList.add('flex');
}
function closeCreateGroup() { document.getElementById('createGroupModal').classList.add('hidden'); document.getElementById('createGroupModal').classList.remove('flex'); }
function previewGAv(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => { tempGAvatar = ev.target.result; document.getElementById('newGAv').src = tempGAvatar; }; r.readAsDataURL(f);
}
function createGroup() {
  const name = document.getElementById('newGName').value.trim();
  if (!name) return toast('Enter a group name');
  const g = { id: 'g_' + Date.now(), name, avatar: tempGAvatar || `https://api.dicebear.com/7.x/identicon/svg?seed=${name}`, members: [me.id], admins: [me.id], createdBy: me.id, isWorld: false };
  let groups = DB.get('groups', []); groups.push(g); DB.set('groups', groups);
  let msgs = DB.get('messages', {}); msgs[g.id] = []; DB.set('messages', msgs);
  closeCreateGroup(); renderGroups(); goPage('groups'); toast('Group created!');
}

function openChat(id, type) {
  activeId = id; activeType = type;
  document.getElementById('chatView').classList.remove('hidden');
  document.getElementById('btnGroupInfo').classList.toggle('hidden', type !== 'group');
  if (type === 'personal') {
    const u = DB.get('users', []).find(x => x.id === id); if (!u) return;
    document.getElementById('cAvatar').src = u.avatar;
    document.getElementById('cName').innerHTML = `${esc(u.name)} ${getBadgeHtml(u)}`;
    document.getElementById('cStatus').textContent = u.online ? 'Online' : 'Offline';
    document.getElementById('cOnline').classList.toggle('hidden', !u.online);
    let chats = getPersonalChats(); const c = chats.find(x => x.userId === id); if (c) { c.unread = 0; savePersonalChats(chats); }
  } else {
    const g = DB.get('groups', []).find(x => x.id === id); if (!g) return;
    document.getElementById('cAvatar').src = g.avatar;
    document.getElementById('cName').textContent = g.name;
    document.getElementById('cStatus').textContent = g.members.length + ' members';
    document.getElementById('cOnline').classList.add('hidden');
  }
  renderMessages();
}

function closeChat() { document.getElementById('chatView').classList.add('hidden'); activeId = null; }
function getMsgKey() { return activeType === 'personal' ? [me.id, activeId].sort().join('_') : activeId; }

function renderMessages() {
  const area = document.getElementById('msgArea');
  const key = getMsgKey();
  const msgs = (DB.get('messages', {})[key] || []);
  const users = DB.get('users', []);
  area.innerHTML = msgs.map(m => {
    const isMe = m.from === me.id;
    const sender = users.find(u => u.id === m.from);
    return `<div class="flex ${isMe ? 'justify-end' : 'justify-start'}"><div class="max-w-[78%]">
      ${!isMe && activeType === 'group' && sender ? `<p class="text-[10px] text-cps-400 mb-0.5 ml-1">${esc(sender.name)}</p>` : ''}
      <div class="${isMe ? 'bubble-me' : 'bubble-other'} px-3.5 py-2.5 text-sm text-white leading-relaxed">${esc(m.text)}</div>
      <p class="text-[10px] text-slate-500 mt-0.5 ${isMe ? 'text-right' : ''} px-1">${m.time}</p></div></div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim(); if (!text || !activeId) return;
  const now = new Date(); const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  const key = getMsgKey(); let all = DB.get('messages', {}); if (!all[key]) all[key] = [];
  all[key].push({ from: me.id, text, time, ts: Date.now() }); DB.set('messages', all);
  if (activeType === 'personal') {
    let chats = getPersonalChats(); let c = chats.find(x => x.userId === activeId);
    if (!c) { c = { userId: activeId, lastMsg: text, time, unread: 0 }; chats.unshift(c); }
    else { c.lastMsg = text; c.time = time; chats = [c, ...chats.filter(x => x.userId !== activeId)]; }
    savePersonalChats(chats);
  }
  input.value = ''; autoH(input); renderMessages();
}
function autoH(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 112) + 'px'; }

function viewUserProfile(uid) {
  const users = DB.get('users', []);
  const u = users.find(x => x.id === uid);
  if (!u) return;
  document.getElementById('upmAv').src = u.avatar;
  document.getElementById('upmName').textContent = u.name;
  document.getElementById('upmBadge').innerHTML = getBadgeHtml(u);
  document.getElementById('upmUser').textContent = '@' + u.username;
  document.getElementById('upmBio').textContent = u.bio ? u.bio : 'No bio available...';
  
  const btn = document.getElementById('upmMessageBtn');
  if (u.id === me.id) {
    btn.textContent = 'Your Own Profile';
    btn.onclick = () => { closeUserProfileModal(); goPage('profile'); };
  } else {
    btn.textContent = 'Send Message';
    btn.onclick = () => { closeUserProfileModal(); startPersonalChat(u.id); };
  }
  document.getElementById('userProfileModal').classList.remove('hidden');
}

function closeUserProfileModal() { document.getElementById('userProfileModal').classList.add('hidden'); }
function viewChatProfile() { if(activeType === 'personal') viewUserProfile(activeId); }

function getBadgeHtml(u) {
  if (u.isOwner) return '<span class="owner-badge">👑 OWNER</span>';
  if (u.isVerified) return '<span class="verified-badge">✔ VERIFIED</span>';
  return '';
}

function requestVerification() {
  toast('Verification service is currently closed!');
}

function openGroupInfo() {
  if (activeType !== 'group') return;
  const g = DB.get('groups', []).find(x => x.id === activeId); if (!g) return;
  document.getElementById('groupInfo').classList.remove('hidden');
  document.getElementById('giAv').src = g.avatar;
  document.getElementById('giName').textContent = g.name;
  document.getElementById('giMembers').textContent = g.members.length + ' members';
  const users = DB.get('users', []);
  document.getElementById('giMemberList').innerHTML = g.members.map(mid => {
    const u = users.find(x => x.id === mid) || { name: 'Unknown', username: '?', avatar: '', id: mid };
    return `<div onclick="viewUserProfile('${u.id}')" class="flex items-center gap-3 py-2 px-2 rounded-xl cursor-pointer active:bg-white/5"><img src="${u.avatar}" class="w-9 h-9 rounded-full bg-dark-700 object-cover"><div class="flex-1"><p class="text-sm text-white flex items-center gap-1">${esc(u.name)} ${getBadgeHtml(u)}</p><p class="text-[11px] text-slate-400">@${esc(u.username)}</p></div></div>`;
  }).join('');
}
function closeGroupInfo() { document.getElementById('groupInfo').classList.add('hidden'); }

function doGlobalSearch(val) {
  const box = document.getElementById('searchResults');
  if (!val.trim()) { box.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">Search by name or username</p>'; return; }
  const f = val.toLowerCase().replace('@', '');
  const users = DB.get('users', []).filter(u => u.id !== me.id && (u.name.toLowerCase().includes(f) || u.username.includes(f)));
  if (users.length === 0) { box.innerHTML = '<p class="text-center text-slate-500 text-sm py-8">No users found</p>'; return; }
  box.innerHTML = users.map(u => `<div class="flex items-center gap-3 px-3 py-3 rounded-2xl active:bg-white/5 cursor-pointer" onclick="startPersonalChat('${u.id}')">
    <img onclick="event.stopPropagation(); viewUserProfile('${u.id}')" src="${u.avatar}" class="w-11 h-11 rounded-full bg-dark-700 object-cover shrink-0">
    <div class="flex-1 min-w-0"><p class="text-sm font-medium text-white flex items-center gap-1">${esc(u.name)} ${getBadgeHtml(u)}</p><p class="text-xs text-slate-400">@${esc(u.username)}</p></div>
    ${u.online ? '<span class="text-[10px] text-green-400 shrink-0">Online</span>' : ''}</div>`).join('');
}

function startPersonalChat(uid) {
  let chats = getPersonalChats();
  if (!chats.find(c => c.userId === uid)) { chats.unshift({ userId: uid, lastMsg: '', time: '', unread: 0 }); savePersonalChats(chats); }
  openChat(uid, 'personal');
}

function openNewChat() {
  document.getElementById('newChatModal').classList.remove('hidden'); document.getElementById('newChatModal').classList.add('flex');
  document.getElementById('newChatSearch').value = ''; searchForNewChat('');
}
function closeNewChat() { document.getElementById('newChatModal').classList.add('hidden'); document.getElementById('newChatModal').classList.remove('flex'); }

function searchForNewChat(val) {
  const box = document.getElementById('newChatResults');
  const f = val.toLowerCase().replace('@', '');
  let users = DB.get('users', []).filter(u => u.id !== me.id);
  if (f) users = users.filter(u => u.name.toLowerCase().includes(f) || u.username.includes(f));
  if (users.length === 0) { box.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">No users found</p>'; return; }
  box.innerHTML = users.map(u => `<div onclick="startPersonalChat('${u.id}'); closeNewChat();" class="flex items-center gap-3 px-3 py-3 rounded-2xl active:bg-white/5 cursor-pointer">
    <img src="${u.avatar}" class="w-10 h-10 rounded-full bg-dark-700 object-cover"><div><p class="text-sm text-white flex items-center gap-1">${esc(u.name)} ${getBadgeHtml(u)}</p><p class="text-xs text-slate-400">@${esc(u.username)}</p></div></div>`).join('');
}

function loadProfileUI() {
  if (!me) return;
  document.getElementById('profAv').src = me.avatar;
  document.getElementById('profNameDisplay').innerHTML = `${esc(me.name)} ${getBadgeHtml(me)}`;
  document.getElementById('profUserDisplay').textContent = '@' + me.username;

  document.getElementById('newPass').value = '';

}

function copyProfileLink() {

  if (navigator.share) {
    navigator.share({ title: 'CPS Online Profile', text: 'My CPS Online Profile:', url: link }).catch(() => {});

function changeMyAvatar(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = ev => {
    me.avatar = ev.target.result;
    let users = DB.get('users', []); const idx = users.findIndex(u => u.id === me.id);
    if (idx >= 0) { users[idx].avatar = me.avatar; DB.set('users', users); }

function saveProfile() {
  const newName = document.getElementById('editName').value.trim();
  const newUsername = document.getElementById('editUser').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');

function openOwnerPanel() {

}

function toggleVerifyUser(uid) {

}

function toggleBanUser(uid) {

  const idx = users.findIndex(u => u.id === uid);
  if (idx >= 0) {
    users[idx].isBanned = !users[idx].isBanned;

function resetAllMessages() {

}

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 z-[100] bg-dark-700 text-white text-sm px-4 py-2.5 rounded-full shadow-2xl fade-in border border-white/10';

}

function refreshUI() {

  const fresh = DB.get('users', []).find(x => x.id === me.id); if (fresh) me = fresh;
  if (!document.getElementById('chatView').classList.contains('hidden')) renderMessages();
  renderPersonal(); renderGroups();
}
window.addEventListener('cps-sync', refreshUI);
auth.onAuthStateChanged(async fb => {
  await kvReady;
  if (!fb) { showAuth(); return; }
  let u = DB.get('users', []).find(x => x.id === fb.uid);
  if (!u) {
    const base = pendingReg && pendingReg.email === fb.email ? pendingReg : null;
    const nm = (fb.email || 'user').split('@')[0].replace(/[^a-z0-9_]/g, '') || 'user';
    u = base ? { ...base, id: fb.uid } : { id: fb.uid, name: nm, email: fb.email, username: nm,
      avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${nm}`, bio: '', online: true, isBanned: false, isVerified: false };
    const users = DB.get('users', []); users.push(u); DB.set('users', users);
  }
  pendingReg = null;

  me = u; ensureWorldGroup();

<script>
/* ===== CPS CALLS: audio, video, screen share, group calls (WebRTC media, Firestore signalling) ===== */
const RTC_CONF = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
const FV = firebase.firestore.FieldValue;
let CALL = null, incomingId = null, incomingData = null, ringUnsub = null;
const CALLS = { toggleMic, toggleCam, toggleShare, hangup, accept, decline };

const CALL_CSS = `
.cbtn{width:52px;height:52px;border-radius:9999px;background:#243044;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;border:0}
.cbtn.off{background:#7f1d1d}.cbtn.on{background:#0c8ce9}.cbtn.end{background:#dc2626}
#callGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));grid-auto-rows:1fr;gap:8px;padding:8px}
.tile{position:relative;background:#111827;border-radius:16px;overflow:hidden;min-height:140px}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .av{position:absolute;inset:0;align-items:center;justify-content:center;font-size:40px;font-weight:600;color:#fff;background:#1a2332}
.tile .lbl{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:8px}`;

function ensureCallUI() {
  if (document.getElementById('callOverlay')) return;
  const st = document.createElement('style'); st.textContent = CALL_CSS; document.head.appendChild(st);
  document.body.insertAdjacentHTML('beforeend', `
  <div id="callOverlay" style="display:none" class="fixed inset-0 z-[60] flex-col bg-dark-900">
    <div class="px-4 pt-4 pb-2 text-center shrink-0"><p id="callTitle" class="text-base font-semibold text-white"></p><p id="callStatus" class="text-xs text-slate-400"></p></div>
    <div id="callGrid" class="flex-1 min-h-0 overflow-y-auto"></div>
    <div class="flex items-center justify-center gap-4 px-3 py-4 safe-b glass border-t border-white/5 shrink-0">
      <button id="cbMic" onclick="CALLS.toggleMic()" class="cbtn" title="Mic">🎙️</button>
      <button id="cbCam" onclick="CALLS.toggleCam()" class="cbtn" title="Camera">📷</button>
      <button id="cbShare" onclick="CALLS.toggleShare()" class="cbtn" title="Share screen">🖥️</button>
      <button onclick="CALLS.hangup()" class="cbtn end" title="End">📞</button>
    </div>
  </div>
  <div id="incomingBox" style="display:none" class="fixed inset-0 z-[70] items-center justify-center bg-black/70 p-4">
    <div class="glass rounded-3xl p-6 w-full max-w-sm text-center slide-up">
      <p id="incTitle" class="text-lg font-semibold text-white"></p>
      <p id="incSub" class="text-sm text-slate-400 mt-1"></p>
      <div class="flex gap-3 mt-6">
        <button onclick="CALLS.decline()" class="flex-1 py-3 rounded-xl bg-red-600 text-white text-sm font-semibold">Decline</button>
        <button onclick="CALLS.accept()" class="flex-1 py-3 rounded-xl btn-p text-white text-sm font-semibold">Accept</button>
      </div>
    </div>
  </div>`);
}

function userName(id) { const u = DB.get('users', []).find(x => x.id === id); return u ? u.name : 'Guest'; }
function getLocal(type) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('unsupported');
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true },
    video: type === 'video' ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false
  });
}
function newCall(id, kind, type, title) {
  return { id, kind, type, title, peers: new Map(), orphan: {}, unsubs: [], local: null, screenStream: null, micOn: true, camOn: type === 'video', isCaller: false };
}

/* ---------- ringing ---------- */
function startRingListener() {
  stopRingListener(); ensureCallUI();
  if (!me) return;
  ringUnsub = db.collection('calls').where('ringFor', 'array-contains', me.id).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const c = ch.doc.data(), id = ch.doc.id;
      const stale = ch.type === 'removed' || c.status !== 'ringing' || CALL || Date.now() - (c.createdAt || 0) > 60000;
      if (stale) { if (incomingId === id) hideIncoming(); return; }
      if (incomingId !== id) showIncoming(id, c);
    });
  }, e => console.warn('ring listener', e));
}
function stopRingListener() { if (ringUnsub) { ringUnsub(); ringUnsub = null; } }
function showIncoming(id, c) {
  incomingId = id; incomingData = c; ensureCallUI();
  document.getElementById('incTitle').textContent = (c.callerName || 'Someone') + ' is calling';
  document.getElementById('incSub').textContent = (c.kind === 'group' ? (c.title || 'Group') + ' · ' : '') + (c.type === 'video' ? 'Video call' : 'Audio call');
  document.getElementById('incomingBox').style.display = 'flex';
  if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
}
function hideIncoming() {
  incomingId = null; incomingData = null;
  const b = document.getElementById('incomingBox'); if (b) b.style.display = 'none';
}
async function accept() { const id = incomingId, c = incomingData; hideIncoming(); if (id) await joinCall(id, c); }
async function decline() {
  const id = incomingId; hideIncoming(); if (!id) return;
  try { await db.collection('calls').doc(id).update({ ringFor: FV.arrayRemove(me.id) }); } catch (e) { console.warn(e); }
}

/* ---------- starting / joining ---------- */
async function startCall(kind, type, members, title, groupId) {
  if (CALL) return toast('You are already in a call');
  let local;
  try { local = await getLocal(type); } catch (e) { return toast('Mic or camera not available'); }
  const id = 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  const others = members.filter(x => x !== me.id);
  CALL = newCall(id, kind, type, title); CALL.local = local; CALL.isCaller = true;
  showOverlay(); listenSignals(id); watchCall(id);
  await db.collection('calls').doc(id).set({
    kind, type, title, groupId: groupId || null, callerId: me.id, callerName: me.name,
    ringFor: others, participants: [me.id], status: 'ringing', createdAt: Date.now()
  });
  setTimeout(() => { if (CALL && CALL.id === id && !CALL.peers.size) { toast('No one answered'); hangup(); } }, 45000);
}
async function joinCall(id, c) {
  if (CALL) return toast('You are already in a call');
  let local;
  try { local = await getLocal(c.type); } catch (e) { return toast('Mic or camera not available'); }
  const ref = db.collection('calls').doc(id);
  const snap = await ref.get();
  if (!snap.exists || snap.data().status === 'ended') { local.getTracks().forEach(t => t.stop()); return toast('This call has ended'); }
  const existing = (snap.data().participants || []).filter(x => x !== me.id);
  CALL = newCall(id, c.kind, c.type, c.title); CALL.local = local;
  showOverlay(); listenSignals(id); watchCall(id);
  await ref.update({ participants: FV.arrayUnion(me.id), ringFor: FV.arrayRemove(me.id), status: 'active' });
  for (const pid of existing) { const p = makePeer(pid); await sendOffer(p); }
}
function startChatCall(type) {
  if (!me || !activeId) return;
  if (activeType === 'group') return startGroupCall(type);
  const u = DB.get('users', []).find(x => x.id === activeId); if (!u) return;
  startCall('personal', type, [u.id], u.name, null);
}
async function startGroupCall(type) {
  const g = DB.get('groups', []).find(x => x.id === activeId); if (!g) return;
  try {
    const q = await db.collection('calls').where('groupId', '==', g.id).where('status', '==', 'active').get();
    const live = q.docs.map(d => ({ id: d.id, ...d.data() })).find(c => (c.participants || []).length);
    if (live) return joinCall(live.id, live);
  } catch (e) { console.warn(e); }
  startCall('group', type, g.members, g.name, g.id);
}

/* ---------- signalling ---------- */
function send(to, kind, data) {
  if (!CALL) return;
  db.collection('calls').doc(CALL.id).collection('signals')
    .add({ from: me.id, to, kind, data, ts: Date.now() }).catch(e => console.warn(e));
}
function listenSignals(id) {
  CALL.unsubs.push(db.collection('calls').doc(id).collection('signals').where('to', '==', me.id).onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'added') return;
      const s = ch.doc.data(); ch.doc.ref.delete().catch(() => {});
      handleSignal(s).catch(e => console.warn('signal', e));
    });
  }));
}
function watchCall(id) {
  CALL.unsubs.push(db.collection('calls').doc(id).onSnapshot(s => {
    const d = s.data(); if (!d || !CALL || CALL.id !== id) return;
    if (d.status === 'ended') { toast('Call ended'); return hangup(); }
    if (CALL.isCaller && d.status === 'ringing' && !(d.ringFor || []).length && !CALL.peers.size) { toast('Call declined'); hangup(); }
  }));
}
async function handleSignal(s) {
  if (!CALL) return;
  if (s.kind === 'leave') return removePeer(s.from);
  if (s.kind === 'ice') {
    const p = CALL.peers.get(s.from);
    if (!p) { (CALL.orphan[s.from] ||= []).push(s.data); return; }
    if (p.pc.remoteDescription) p.pc.addIceCandidate(s.data).catch(() => {});
    else p.pending.push(s.data);
    return;
  }
  let p = CALL.peers.get(s.from);
  if (s.kind === 'offer') {
    if (!p) p = makePeer(s.from);
    await p.pc.setRemoteDescription({ type: 'offer', sdp: s.data });
    await flush(p);
    const a = await p.pc.createAnswer();
    await p.pc.setLocalDescription(a);
    send(s.from, 'answer', a.sdp);
    setTimeout(() => { p.live = true; }, 1500);
    renderTiles();
  } else if (s.kind === 'answer' && p) {
    await p.pc.setRemoteDescription({ type: 'answer', sdp: s.data });
    await flush(p); p.live = true;
  }
}
async function flush(p) { const q = p.pending; p.pending = []; for (const c of q) await p.pc.addIceCandidate(c).catch(() => {}); }

/* ---------- peers (full mesh) ---------- */
function makePeer(pid) {
  const pc = new RTCPeerConnection(RTC_CONF);
  const p = { pc, pid, name: userName(pid), main: new MediaStream(), screen: null, mainId: null, scr: null, live: false, pending: CALL.orphan[pid] || [] };
  delete CALL.orphan[pid];
  CALL.peers.set(pid, p);
  if (CALL.local) CALL.local.getTracks().forEach(t => pc.addTrack(t, CALL.local));
  if (CALL.screenStream) p.scr = pc.addTrack(CALL.screenStream.getVideoTracks()[0], CALL.screenStream);
  pc.onicecandidate = e => { if (e.candidate) send(pid, 'ice', e.candidate.toJSON()); };
  pc.ontrack = e => {
    const sid = e.streams[0] ? e.streams[0].id : 'none';
    if (!p.mainId) p.mainId = sid;
    if (sid === p.mainId) p.main.addTrack(e.track);
    else { p.screen = p.screen || new MediaStream(); p.screen.addTrack(e.track); }
    e.track.onmute = e.track.onunmute = e.track.onended = () => renderTiles();
    renderTiles();
  };
  pc.onnegotiationneeded = () => { if (p.live) sendOffer(p); };
  pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState)) removePeer(pid); };
  return p;
}
async function sendOffer(p) {
  const o = await p.pc.createOffer();
  await p.pc.setLocalDescription(o);
  send(p.pid, 'offer', o.sdp);
}
function removePeer(pid) {
  if (!CALL) return;
  const p = CALL.peers.get(pid);
  if (p) { try { p.pc.close(); } catch {} CALL.peers.delete(pid); }
  if (CALL.kind === 'personal' && p && !CALL.peers.size) { toast('Call ended'); return hangup(); }
  renderTiles();
}

/* ---------- UI ---------- */
function showOverlay() {
  ensureCallUI();
  document.getElementById('callTitle').textContent = CALL.title || 'Call';
  document.getElementById('cbCam').style.display = CALL.type === 'video' ? '' : 'none';
  document.getElementById('callOverlay').style.display = 'flex';
  paint(); renderTiles();
}
function paint() {
  const t = (id, on, cls) => document.getElementById(id).classList.toggle(cls, on);
  t('cbMic', !CALL.micOn, 'off'); t('cbCam', !CALL.camOn, 'off'); t('cbShare', !!CALL.screenStream, 'on');
}
function tile(stream, label, mute) {
  const d = document.createElement('div'); d.className = 'tile';
  const v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.muted = mute; v.srcObject = stream;
  const hasVid = !!stream && stream.getVideoTracks().some(t => t.enabled && t.readyState === 'live' && !t.muted);
  v.style.display = hasVid ? '' : 'none';
  const av = document.createElement('div'); av.className = 'av';
  av.style.display = hasVid ? 'none' : 'flex'; av.textContent = (label || '?')[0].toUpperCase();
  const l = document.createElement('span'); l.className = 'lbl'; l.textContent = label;
  d.append(v, av, l); v.play().catch(() => {});
  return d;
}
function renderTiles() {
  if (!CALL) return;
  const g = document.getElementById('callGrid'); if (!g) return;
  g.innerHTML = '';
  g.appendChild(tile(CALL.local, 'You', true));
  if (CALL.screenStream) g.appendChild(tile(CALL.screenStream, 'Your screen', true));
  CALL.peers.forEach(p => {
    g.appendChild(tile(p.main, p.name, false));
    if (p.screen) g.appendChild(tile(p.screen, p.name + ' · screen', false));
  });
  document.getElementById('callStatus').textContent = CALL.peers.size ? (CALL.peers.size + 1) + ' in call' : 'Calling…';
}

/* ---------- controls ---------- */
function toggleMic() { if (!CALL) return; CALL.micOn = !CALL.micOn; CALL.local.getAudioTracks().forEach(t => t.enabled = CALL.micOn); paint(); }
function toggleCam() { if (!CALL) return; CALL.camOn = !CALL.camOn; CALL.local.getVideoTracks().forEach(t => t.enabled = CALL.camOn); paint(); renderTiles(); }
async function toggleShare() {
  if (!CALL) return;
  if (CALL.screenStream) return stopShare();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return toast('Screen share is not supported on this device');
  let s;
  try { s = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false }); } catch (e) { return toast('Screen share cancelled'); }
  if (!CALL) return s.getTracks().forEach(t => t.stop());
  CALL.screenStream = s;
  const track = s.getVideoTracks()[0];
  track.onended = stopShare;
  for (const p of CALL.peers.values()) {
    if (p.scr) await p.scr.replaceTrack(track).catch(() => {});
    else p.scr = p.pc.addTrack(track, s);
  }
  paint(); renderTiles();
}
function stopShare() {
  if (!CALL || !CALL.screenStream) return;
  CALL.screenStream.getTracks().forEach(t => t.stop());
  CALL.peers.forEach(p => { if (p.scr) p.scr.replaceTrack(null).catch(() => {}); });
  CALL.screenStream = null; paint(); renderTiles();
}
async function hangup() {
  const c = CALL; if (!c) return;
  c.peers.forEach((p, pid) => { send(pid, 'leave', null); try { p.pc.close(); } catch {} });
  c.unsubs.forEach(u => u());
  if (c.local) c.local.getTracks().forEach(t => t.stop());
  if (c.screenStream) c.screenStream.getTracks().forEach(t => t.stop());
  CALL = null;
  document.getElementById('callOverlay').style.display = 'none';
  const ref = db.collection('calls').doc(c.id);
  try {
    await ref.update({ participants: FV.arrayRemove(me.id) });
    const s = await ref.get();
    if (s.exists && !(s.data().participants || []).length) await ref.update({ status: 'ended', ringFor: [] });
  } catch (e) { console.warn('hangup', e); }
}

/* ---------- group extras: group call buttons + add people ---------- */
function renderGroupExtras() {
  const box = document.getElementById('gExtras'); if (!box || !me) return;
  const g = DB.get('groups', []).find(x => x.id === activeId); if (!g) { box.innerHTML = ''; return; }
  const people = DB.get('users', []).filter(u => u.id !== me.id && !g.members.includes(u.id));
  box.innerHTML = `<div class="flex gap-2 mb-5">
      <button onclick="startGroupCall('audio')" class="flex-1 py-2.5 rounded-xl bg-dark-700 text-sm text-white">Group audio call</button>
      <button onclick="startGroupCall('video')" class="flex-1 py-2.5 rounded-xl btn-p text-sm text-white">Group video call</button>
    </div>
    <p class="text-xs text-slate-400 mb-2">Add people to this group</p>` +
    (people.length ? people.map(u => `<div class="flex items-center justify-between py-2">
      <div class="min-w-0"><p class="text-sm text-white truncate">${esc(u.name)}</p><p class="text-[11px] text-slate-400">@${esc(u.username)}</p></div>
      <button onclick="addToGroup('${u.id}')" class="px-3 py-1.5 rounded-lg bg-cps-600/20 text-cps-400 text-xs font-medium shrink-0">Add</button></div>`).join('')
      : '<p class="text-xs text-slate-500">Everyone you know is already in this group</p>');
}
function addToGroup(uid) {
  const groups = DB.get('groups', []); const g = groups.find(x => x.id === activeId); if (!g) return;
  if (!g.members.includes(uid)) g.members.push(uid);
  DB.set('groups', groups);
  document.getElementById('cStatus').textContent = g.members.length + ' members';
  toast('Member added'); openGroupInfo();
}

/* ---------- bug fixes: resized avatars (localStorage quota), live sync across tabs ---------- */
function shrinkImg(file, cb) {
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 256 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(file);
}
function changeMyAvatar(e) {
  shrinkImg(e.target.files[0], url => {
    me.avatar = url;
    const users = DB.get('users', []); const idx = users.findIndex(u => u.id === me.id);
    if (idx >= 0) { users[idx].avatar = url; DB.set('users', users); }
    loadProfileUI(); toast('Profile photo updated');
  });
}
function previewGAv(e) { shrinkImg(e.target.files[0], url => { tempGAvatar = url; document.getElementById('newGAv').src = url; }); }
window.addEventListener('storage', e => {
  if (!me || !e.key || !e.key.startsWith('cps_')) return;
  if (!document.getElementById('chatView').classList.contains('hidden')) renderMessages();
  if (!document.getElementById('app').classList.contains('hidden')) { renderPersonal(); renderGroups(); }
});

/* ---------- hooks into existing app flow ---------- */
const _enterApp = enterApp;
enterApp = function (f) { _enterApp(f); startRingListener(); };
const _logout = logout;
logout = function () { if (CALL) hangup(); stopRingListener(); _logout(); };
const _openGI = openGroupInfo;
openGroupInfo = function () { _openGI(); renderGroupExtras(); };
if (me) startRingListener();

</script>
